<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>たなかAIカンパニー オフィス</title>
<style>
  :root {
    --bg1: #fdf3e3; --bg2: #f3dcc0;
    --ink: #4a3426; --sub: #8a6a55; --card: #fffaf2; --line: #efdcc4;
    --shiba: #e8964a; --mint: #6fbfa8; --rose: #ec9a92; --off: #e4d8ca;
    --overlay: rgba(90, 60, 35, .28); --shadow: 0 8px 28px rgba(120, 80, 40, .2);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #2f2620; --bg2: #1f1915; --ink: #f6e9da; --sub: #c9ae95; --card: #3a2f27;
      --line: #55453a; --off: #5a4c41; --overlay: rgba(0, 0, 0, .45); --shadow: 0 8px 28px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    --bg1: #2f2620; --bg2: #1f1915; --ink: #f6e9da; --sub: #c9ae95; --card: #3a2f27;
    --line: #55453a; --off: #5a4c41; --overlay: rgba(0, 0, 0, .45); --shadow: 0 8px 28px rgba(0, 0, 0, .45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 35%, var(--bg1), var(--bg2));
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }

  /* 隅の小さな表示 */
  #hud {
    position: fixed; left: 14px; top: 14px; z-index: 5;
    background: var(--card); border: 2px solid var(--line); border-radius: 16px;
    padding: 9px 12px 8px; box-shadow: var(--shadow); min-width: 168px;
  }
  #hud .co { font-weight: 800; font-size: 14px; letter-spacing: .02em; }
  #hud .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 2px; font-size: 12px; color: var(--sub); }
  #hud .cnt { font-size: 15px; font-weight: 800; color: var(--ink); }
  #dots { display: flex; gap: 5px; margin-top: 6px; }
  #dots .d { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 9px; color: var(--sub); }
  #dots .d i { width: 14px; height: 14px; border-radius: 50%; background: var(--off); display: block; }
  #dots .d.on i { background: var(--shiba); }
  #dots .d.on.no_news i { background: var(--mint); }
  #dots .d.on.search_failed i { background: var(--rose); }
  #dots .d.today i { outline: 2px solid var(--ink); outline-offset: 1px; }

  #tools { position: fixed; right: 14px; bottom: 14px; z-index: 5; display: flex; gap: 8px; align-items: center; }
  .round {
    border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    height: 44px; min-width: 44px; padding: 0 14px; font: inherit; font-weight: 800; font-size: 15px;
    box-shadow: var(--shadow); cursor: pointer;
  }
  .round:hover { transform: translateY(-1px); }
  #hint { font-size: 11px; color: var(--sub); opacity: .8; }

  /* 名札・吹き出し・報告書バッジ（3Dの上に重ねる） */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  .tag, .bubble, .badge { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; }
  .tag {
    background: #fffaf2; color: #4a3426; border: 2px solid #e8964a; border-radius: 10px;
    padding: 2px 9px; font-size: 13px; font-weight: 800; box-shadow: 0 3px 10px rgba(120,80,40,.2);
  }
  .bubble {
    background: #ffffff; color: #4a3426; border-radius: 14px; padding: 7px 12px; font-size: 14px; font-weight: 800;
    box-shadow: 0 4px 14px rgba(120,80,40,.22); animation: pop .5s ease-out both;
  }
  .bubble::after {
    content: ""; position: absolute; left: 14px; bottom: -8px; border: 8px solid transparent;
    border-top-color: #ffffff; border-bottom: 0;
  }
  .badge {
    pointer-events: auto; cursor: pointer; background: #e8964a; color: #fff; border-radius: 999px;
    padding: 3px 10px; font-size: 13px; font-weight: 800; box-shadow: 0 3px 10px rgba(120,80,40,.3);
    border: 2px solid #fff;
  }
  .badge span { display: inline-block; animation: hop 1.6s ease-in-out infinite; }
  @keyframes pop { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
  @keyframes hop { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3px; } }

  /* ポップアップ */
  #modal { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: var(--overlay); padding: 16px; }
  #modal.open { display: flex; }
  .panel {
    width: min(440px, 100%); max-height: calc(100vh - 32px); overflow: auto;
    background: var(--card); border: 2px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
    padding: 18px 18px 16px; position: relative; animation: pop .25s ease-out both;
  }
  .panel h2 { margin: 0 0 12px; font-size: 17px; }
  .close { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--line); color: var(--ink); font-size: 18px; cursor: pointer; }
  .cards { display: grid; gap: 10px; }
  .card { display: flex; gap: 10px; align-items: center; background: var(--bg1); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .card .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: var(--card); }
  .card .hl { font-weight: 800; font-size: 15px; line-height: 1.35; }
  .card a.src { font-size: 12px; color: var(--sub); text-decoration: none; border-bottom: 1px dashed var(--sub); }
  .empty { text-align: center; padding: 14px 6px; font-weight: 800; font-size: 16px; }
  .empty .big { font-size: 44px; display: block; margin-bottom: 4px; }
  .open-report {
    display: block; text-align: center; margin-top: 14px; padding: 11px; border-radius: 14px;
    background: var(--shiba); color: #fff; text-decoration: none; font-weight: 800;
  }
  .idcard { display: flex; gap: 14px; align-items: center; }
  .idcard .photo { flex: none; width: 96px; height: 96px; border-radius: 18px; background: #fde6c8; display: grid; place-items: center; overflow: hidden; border: 3px solid #e8964a; }
  .idcard dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; }
  .idcard dt { color: var(--sub); }
  .idcard dd { margin: 0; font-weight: 800; }
  .idhead { background: var(--shiba); color: #fff; margin: -18px -18px 14px; padding: 10px 18px; border-radius: 20px 20px 0 0; font-weight: 800; letter-spacing: .1em; font-size: 13px; }

  /* 3Dが使えないときの表示 */
  #fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 90px 16px 16px; overflow: auto; z-index: 3; }
  #fallback.show { display: flex; }
  #fallback .panel { animation: none; }
  .fb-top { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .fb-say { background: var(--bg1); border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px; font-weight: 800; }
  .fb-note { font-size: 11px; color: var(--sub); margin-top: 10px; text-align: center; }

  @media (max-width: 520px) {
    #hud { left: 10px; top: 10px; padding: 7px 10px; }
    #tools { right: 10px; bottom: 10px; }
    #hint { display: none; }
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="labels"></div>

<div id="hud" aria-live="polite">
  <div class="co" id="hud-co">🐾</div>
  <div class="row"><span id="hud-date"></span><span class="cnt" id="hud-count"></span></div>
  <div id="dots" title="直近7日の出勤"></div>
</div>

<div id="tools">
  <span id="hint">🖱 ドラッグ：回転 ／ ホイール：拡大</span>
  <button class="round" id="btn-news" title="今日のニュース">📄</button>
</div>

<div id="fallback"><div class="panel" id="fb-panel"></div></div>

<div id="modal" role="dialog" aria-modal="true">
  <div class="panel" id="modal-panel"></div>
</div>

<!-- 3D表示（three.js r128 と同じ版の OrbitControls）。読み込めなくても件数と見出しは表示されます -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>

<script>
(function () {
  "use strict";

  /* ========== データ ========== */
  var DATA = {};
  try { DATA = JSON.parse(document.getElementById("news-data").textContent) || {}; } catch (e) { DATA = {}; }
  var COMPANY = (DATA.company && DATA.company.name) || "AIカンパニー";
  var EMP = DATA.employee || {};
  var EMP_NAME = EMP.name || "社員";
  var DAYS = Array.isArray(DATA.days) ? DATA.days : [];

  var CAT = {
    chatgpt: { icon: "💬", label: "ChatGPT" },
    claude: { icon: "🧡", label: "Claude" },
    image: { icon: "🎨", label: "画像生成" },
    efficiency: { icon: "⚡", label: "仕事効率化" },
    other: { icon: "🤖", label: "その他" }
  };
  var WD = ["日", "月", "火", "水", "木", "金", "土"];

  function jst() { // 日本時間の各値
    var d = new Date(Date.now() + 9 * 3600e3);
    return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(),
             mi: d.getUTCMinutes(), s: d.getUTCSeconds(), ms: d.getUTCMilliseconds() };
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(t) { return t.y + "-" + pad(t.mo) + "-" + pad(t.d); }
  function shift(dateStr, n) {
    var p = dateStr.split("-").map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
  }
  function wd(dateStr) { var p = dateStr.split("-").map(Number); return WD[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()]; }

  var TODAY = ymd(jst());
  var today = null;
  DAYS.forEach(function (x) { if (x && x.date === TODAY) today = x; });
  var STATE = !today ? "before" : (today.status || "reported"); // before / reported / no_news / search_failed
  var NEWS = (today && Array.isArray(today.news)) ? today.news.slice(0, 5) : [];
  var COUNT = NEWS.length;

  function defaultSpeech() {
    if (STATE === "reported") return "社長！今日は" + COUNT + "件です！";
    if (STATE === "no_news") return "社長！今日は異常なしです！";
    if (STATE === "search_failed") return "社長…今日は調べられませんでした…";
    return "";
  }
  var SPEECH = (today && today.speech) || defaultSpeech();
  var STATE_LABEL = { before: "出社前", reported: "報告済み（" + COUNT + "件）", no_news: "異常なし", search_failed: "検索できず" };

  /* ========== 隅の表示 ========== */
  document.title = COMPANY + " オフィス";
  document.getElementById("hud-co").textContent = "🐾 " + COMPANY;
  var parts = TODAY.split("-");
  document.getElementById("hud-date").textContent = Number(parts[1]) + "/" + Number(parts[2]) + "(" + wd(TODAY) + ")";
  document.getElementById("hud-count").textContent =
    STATE === "before" ? "⏰ 出社前" : STATE === "search_failed" ? "💦 0件" : "📄 " + COUNT + "件";
  var dots = document.getElementById("dots");
  for (var i = 6; i >= 0; i--) {
    var ds = shift(TODAY, -i), rec = null;
    DAYS.forEach(function (x) { if (x && x.date === ds) rec = x; });
    var el = document.createElement("div");
    el.className = "d" + (rec ? " on " + (rec.status || "reported") : "") + (i === 0 ? " today" : "");
    el.title = ds + (rec ? "：出社（" + (STATE_LABEL[rec.status] ? (rec.status === "reported" ? (rec.news || []).length + "件" : STATE_LABEL[rec.status]) : "") + "）" : "：お休み");
    el.innerHTML = "<i></i>";
    el.appendChild(document.createTextNode(wd(ds)));
    dots.appendChild(el);
  }

  /* ========== ポップアップ ========== */
  var modal = document.getElementById("modal"), mpanel = document.getElementById("modal-panel");
  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function safeUrl(u) { return (typeof u === "string" && /^https?:\/\//i.test(u)) ? u : null; }

  function newsContent(container) {
    container.appendChild(h("h2", null, "📄 今日のニュース " + Number(parts[1]) + "/" + Number(parts[2])));
    if (STATE === "reported" && COUNT > 0) {
      var cards = h("div", "cards");
      NEWS.forEach(function (n) {
        var c = h("div", "card");
        var cat = CAT[n.category] || CAT.other;
        var ic = h("div", "ic", cat.icon); ic.title = cat.label; c.appendChild(ic);
        var body = h("div");
        body.appendChild(h("div", "hl", n.headline || "（見出しなし）"));
        var u = safeUrl(n.url);
        if (u) {
          var a = h("a", "src", "出典：" + (n.source || "リンク") + " ↗");
          a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer";
          body.appendChild(a);
        } else if (n.source) { body.appendChild(h("span", "src", "出典：" + n.source)); }
        c.appendChild(body); cards.appendChild(c);
      });
      container.appendChild(cards);
    } else {
      var msg = { before: ["⏰", "まだ出社前です"], no_news: ["✅", "今日は異常なし"], search_failed: ["💦", "今日は調べられませんでした"], reported: ["📭", "0件"] }[STATE];
      var em = h("div", "empty"); em.appendChild(h("span", "big", msg[0])); em.appendChild(document.createTextNode(msg[1]));
      container.appendChild(em);
    }
    if (today && today.report_file) {
      var b = h("a", "open-report", "📝 報告ファイルを開く");
      b.href = encodeURI(today.report_file); b.target = "_blank";
      container.appendChild(b);
    }
  }

  var SHIBA_SVG =
    '<svg viewBox="0 0 100 100" width="92" height="92" aria-hidden="true">' +
    '<polygon points="18,40 26,8 44,30" fill="#e8964a"/><polygon points="82,40 74,8 56,30" fill="#e8964a"/>' +
    '<polygon points="24,34 28,16 38,30" fill="#fff1dc"/><polygon points="76,34 72,16 62,30" fill="#fff1dc"/>' +
    '<ellipse cx="50" cy="56" rx="36" ry="32" fill="#e8964a"/>' +
    '<ellipse cx="50" cy="68" rx="28" ry="20" fill="#fff1dc"/>' +
    '<ellipse cx="38" cy="42" rx="5" ry="3" fill="#fff1dc"/><ellipse cx="62" cy="42" rx="5" ry="3" fill="#fff1dc"/>' +
    '<circle cx="37" cy="52" r="4" fill="#2b2320"/><circle cx="63" cy="52" r="4" fill="#2b2320"/>' +
    '<circle cx="37" cy="52" r="9" fill="none" stroke="#47506b" stroke-width="2.5"/><circle cx="63" cy="52" r="9" fill="none" stroke="#47506b" stroke-width="2.5"/>' +
    '<line x1="46" y1="52" x2="54" y2="52" stroke="#47506b" stroke-width="2.5"/>' +
    '<ellipse cx="50" cy="62" rx="5" ry="3.6" fill="#2b2320"/>' +
    '<path d="M44 68 Q50 73 56 68" fill="none" stroke="#2b2320" stroke-width="2" stroke-linecap="round"/>' +
    '</svg>';

  function idContent(container) {
    container.appendChild(h("div", "idhead", "STAFF ID ／ 社員証"));
    var w = h("div", "idcard");
    var ph = h("div", "photo"); ph.innerHTML = SHIBA_SVG; w.appendChild(ph);
    var dl = h("dl");
    [["名前", EMP_NAME], ["仕事", EMP.job || "AIニュース担当"], ["勤務", EMP.hours || "毎朝 7:00（日本時間）"], ["今日", STATE_LABEL[STATE] || STATE]]
      .forEach(function (r) { dl.appendChild(h("dt", null, r[0])); dl.appendChild(h("dd", null, r[1])); });
    w.appendChild(dl); container.appendChild(w);
    container.appendChild(h("div", "fb-note", COMPANY));
  }

  function openModal(kind) {
    mpanel.innerHTML = "";
    var x = h("button", "close", "×"); x.setAttribute("aria-label", "閉じる"); x.onclick = closeModal; mpanel.appendChild(x);
    (kind === "id" ? idContent : newsContent)(mpanel);
    modal.classList.add("open");
  }
  function closeModal() { modal.classList.remove("open"); }
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
  document.getElementById("btn-news").onclick = function () { openModal("news"); };

  function showFallback() {
    var p = document.getElementById("fb-panel"); p.innerHTML = "";
    var top = h("div", "fb-top");
    var ph = h("div"); ph.innerHTML = SHIBA_SVG; top.appendChild(ph);
    var right = h("div");
    var tg = right.appendChild(h("div", "tag", EMP_NAME)); tg.style.position = "static"; tg.style.display = "inline-block";
    if (SPEECH) right.appendChild(h("div", "fb-say", SPEECH)).style.marginTop = "6px";
    else right.appendChild(h("div", "fb-say", "⏰ 出社前")).style.marginTop = "6px";
    top.appendChild(right); p.appendChild(top);
    newsContent(p);
    p.appendChild(h("div", "fb-note", "3D表示を読み込めなかったため、かんたん表示にしています（ネット接続を確認してください）"));
    document.getElementById("fallback").classList.add("show");
    document.getElementById("hint").style.display = "none";
  }

  // 日付が変わったら読み込み直す
  setInterval(function () { if (ymd(jst()) !== TODAY) location.reload(); }, 60000);

  /* ========== 3D オフィス ========== */
  if (typeof THREE === "undefined") { showFallback(); return; }
  try { start3D(); } catch (err) { console.error(err); document.getElementById("stage").innerHTML = ""; document.getElementById("labels").innerHTML = ""; showFallback(); }

  function start3D() {
    var stage = document.getElementById("stage");
    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);

    var FONT = '"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif';
    var grad = (function () {
      var t = new THREE.DataTexture(new Uint8Array([130, 130, 130, 255, 205, 205, 205, 255, 250, 250, 250, 255]), 3, 1, THREE.RGBAFormat);
      t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t;
    })();
    function M(color, extra) { var o = { color: color, gradientMap: grad }; for (var k in extra) o[k] = extra[k]; return new THREE.MeshToonMaterial(o); }
    function add(geo, mat, x, y, z, parent, noShadow) {
      var m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0);
      if (!noShadow) { m.castShadow = true; m.receiveShadow = true; }
      (parent || scene).add(m); return m;
    }
    function canvasTex(w, hgt, draw) {
      var c = document.createElement("canvas"); c.width = w; c.height = hgt;
      draw(c.getContext("2d"), w, hgt);

        add(SPH, C, s * 0.14, 0.08, 0.37, g).scale.set(0.08, 0.06, 0.11);
      });
      var tail = new THREE.Group(); tail.position.set(0, 0.7, -0.26); g.add(tail);
      var tt = add(new THREE.TorusGeometry(0.09, 0.045, 10, 22, Math.PI * 1.5), O, 0, 0.08, -0.02, tail); tt.rotation.y = Math.PI / 2;
      add(SPH, C, 0, 0.17, -0.02, tail).scale.setScalar(0.05);

      var head = new THREE.Group(); head.position.set(0, 1.36, 0.03); g.add(head);
      add(SPH, O, 0, 0, 0, head).scale.set(0.3, 0.27, 0.27);
      add(SPH, C, 0, -0.08, 0.1, head).scale.set(0.24, 0.15, 0.2);
      add(SPH, C, 0, -0.07, 0.21, head).scale.set(0.13, 0.1, 0.11);
      add(SPH, K, 0, -0.03, 0.315, head).scale.set(0.045, 0.034, 0.03);
      var mouth = add(new THREE.TorusGeometry(0.03, 0.008, 6, 14, Math.PI), K, 0, -0.1, 0.3, head); mouth.rotation.z = Math.PI;
      var eyes = [], brows = [];
      [-1, 1].forEach(function (s) {
        var e = add(SPH, K, s * 0.1, 0.035, 0.238, head); e.scale.set(0.034, 0.045, 0.02); eyes.push(e);
        add(SPH, M(0xffffff), s * 0.1 + 0.012, 0.05, 0.255, head, true).scale.setScalar(0.011);
        var br = add(SPH, C, s * 0.095, 0.125, 0.225, head); br.scale.set(0.045, 0.024, 0.02); brows.push(br);
        var ear = add(new THREE.ConeGeometry(0.095, 0.2, 14), O, s * 0.17, 0.23, -0.02, head); ear.rotation.z = -s * 0.35;
        var inner = add(new THREE.ConeGeometry(0.055, 0.13, 12), C, s * 0.168, 0.215, 0.025, head); inner.rotation.z = -s * 0.35;
        // メガネ
        var ring = add(new THREE.TorusGeometry(0.066, 0.011, 8, 26), G, s * 0.1, 0.035, 0.268, head);
        var temple = add(new THREE.BoxGeometry(0.012, 0.012, 0.2), G, s * 0.17, 0.045, 0.17, head); temple.rotation.y = s * 0.25;
      });
      add(new THREE.CylinderGeometry(0.009, 0.009, 0.07, 6), G, 0, 0.045, 0.272, head).rotation.z = Math.PI / 2;
      var sweat = add(SPH, new THREE.MeshToonMaterial({ color: 0x8fd0f2, gradientMap: grad, transparent: true, opacity: 0.9 }), 0.27, 0.1, 0.1, head, true);
      sweat.scale.set(0.05, 0.08, 0.05); sweat.visible = false;

      var arms = [];
      [-1, 1].forEach(function (s) {
        var arm = new THREE.Group(); arm.position.set(s * 0.26, 0.98, 0.03); g.add(arm);
        var geo = new THREE.CylinderGeometry(0.055, 0.05, 0.4, 12); geo.rotateX(Math.PI / 2); geo.translate(0, 0, 0.2);
        add(geo, O, 0, 0, 0, arm);
        add(SPH, C, 0, 0, 0.42, arm).scale.set(0.065, 0.05, 0.07);
        arms.push({ g: arm, s: s });
      });
      g.traverse(function (o) { o.userData.action = "id"; });
      return { group: g, head: head, eyes: eyes, brows: brows, mouth: mouth, arms: arms, tail: tail, sweat: sweat };
    }
    if (present) {
      shiba = makeShiba();
      shiba.group.position.set(0, 0, -0.56);
      empDesk.add(shiba.group);
      if (STATE === "search_failed") {
        shiba.brows[0].rotation.z = -0.55; shiba.brows[1].rotation.z = 0.55;
        shiba.brows[0].position.y = shiba.brows[1].position.y = 0.135;
        shiba.mouth.rotation.z = 0; shiba.mouth.position.y = -0.125;
        shiba.sweat.visible = true;
      }
    }

    /* --- 名札・吹き出し・報告書バッジ --- */
    var labels = document.getElementById("labels");
    var anchors = [];
    function anchor(el, obj, local, dx, dy) { labels.appendChild(el); anchors.push({ el: el, obj: obj, local: local, dx: dx, dy: dy }); }
    if (shiba) {
      anchor(h("div", "tag", EMP_NAME), shiba.group, new THREE.Vector3(0, 1.95, 0), -0.5, -1);
      if (SPEECH) { anchor(h("div", "bubble", SPEECH), shiba.group, new THREE.Vector3(0, 1.95, 0), 0, 0); anchors[anchors.length - 1].above = anchors[anchors.length - 2]; }
    }
    if (STATE === "reported" && COUNT > 0) {
      var bd = h("div", "badge"); var sp = h("span", null, "📄 " + COUNT); bd.appendChild(sp);
      bd.title = "今日のニュース"; bd.onclick = function () { openModal("news"); };
      anchor(bd, stack, new THREE.Vector3(0, 0.28 + COUNT * 0.026, 0), -0.5, -1);
    }
    var tmpV = new THREE.Vector3();
    function placeLabels() {
      var w = window.innerWidth, hh = window.innerHeight;
      anchors.forEach(function (a) {
        tmpV.copy(a.local); a.obj.localToWorld(tmpV); tmpV.project(camera);
        var x = (tmpV.x + 1) / 2 * w, y = (1 - tmpV.y) / 2 * hh;
        var r = a.el.getBoundingClientRect();
        if (a.above) { // 名札のすぐ上に置く
          var tr = a.above.el.getBoundingClientRect();
          x = a.above.px + tr.width / 2 - 22; y = a.above.py - r.height - 12;
          a.el.style.transform = "translate(" + Math.round(Math.max(8, Math.min(w - r.width - 8, x))) + "px," + Math.round(y) + "px)";
          a.el.style.visibility = a.above.el.style.visibility; return;
        }
        var px = Math.max(8, Math.min(w - r.width - 8, x + a.dx * r.width));   // 画面からはみ出さないように
        a.px = px; a.py = y + a.dy * r.height;
        a.el.style.transform = "translate(" + Math.round(a.px) + "px," + Math.round(a.py) + "px)";
        a.el.style.visibility = tmpV.z < 1 ? "visible" : "hidden";
      });
    }

    /* --- カメラ操作（ドラッグで回転・ホイールで拡大・ゆっくり自動で回る） --- */
    var TARGET = new THREE.Vector3(0, 0.9, -0.2);
    var AZ_MIN = -0.15, AZ_MAX = 1.7;
    var portrait = window.innerWidth / window.innerHeight < 1;
    var startR = portrait ? 23 : 12.5;
    camera.position.set(TARGET.x + startR * Math.sin(1.0) * Math.sin(0.75), TARGET.y + startR * Math.cos(1.0), TARGET.z + startR * Math.sin(1.0) * Math.cos(0.75));
    camera.lookAt(TARGET);
    var controls = null, ctrlUpdate;
    if (THREE.OrbitControls) {
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.copy(TARGET);
      controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false;
      controls.minDistance = 7; controls.maxDistance = 28;
      controls.minPolarAngle = 0.35; controls.maxPolarAngle = 1.3;
      controls.minAzimuthAngle = AZ_MIN; controls.maxAzimuthAngle = AZ_MAX;
      controls.autoRotate = true; controls.autoRotateSpeed = 0.45;
      var resumeT = null;
      controls.addEventListener("start", function () { controls.autoRotate = false; clearTimeout(resumeT); });
      controls.addEventListener("end", function () { clearTimeout(resumeT); resumeT = setTimeout(function () { controls.autoRotate = true; }, 4000); });
      ctrlUpdate = function () {
        var az = controls.getAzimuthalAngle();
        if (az < AZ_MIN + 0.12) controls.autoRotateSpeed = -0.45;      // 端まで来たら向きを変える
        else if (az > AZ_MAX - 0.12) controls.autoRotateSpeed = 0.45;
        controls.update();
      };
    } else {
      // OrbitControls が読めなかったときの簡易操作
      var sph = { th: 0.75, ph: 1.0, r: startR }, dir = 1, idle = 0, ptrs = {}, pinch = 0;
      var el = renderer.domElement;
      function apply() {
        sph.th = Math.max(AZ_MIN, Math.min(AZ_MAX, sph.th)); sph.ph = Math.max(0.35, Math.min(1.3, sph.ph)); sph.r = Math.max(7, Math.min(28, sph.r));
        camera.position.set(TARGET.x + sph.r * Math.sin(sph.ph) * Math.sin(sph.th), TARGET.y + sph.r * Math.cos(sph.ph), TARGET.z + sph.r * Math.sin(sph.ph) * Math.cos(sph.th));
        camera.lookAt(TARGET);
      }
      el.addEventListener("pointerdown", function (e) { ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; el.setPointerCapture(e.pointerId); idle = -4; });
      el.addEventListener("pointermove", function (e) {
        var p = ptrs[e.pointerId]; if (!p) return;
        var ids = Object.keys(ptrs);
        if (ids.length === 2) {
          p.x = e.clientX; p.y = e.clientY;
          var a = ptrs[ids[0]], b = ptrs[ids[1]], dd = Math.hypot(a.x - b.x, a.y - b.y);
          if (pinch) sph.r *= pinch / dd; pinch = dd;
        } else {
          sph.th -= (e.clientX - p.x) * 0.006; sph.ph -= (e.clientY - p.y) * 0.004; p.x = e.clientX; p.y = e.clientY;
        }
        idle = -4;
      });
      function up(e) { delete ptrs[e.pointerId]; pinch = 0; }
      el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
      el.addEventListener("wheel", function (e) { e.preventDefault(); sph.r *= e.deltaY > 0 ? 1.08 : 0.93; idle = -4; }, { passive: false });
      ctrlUpdate = function (dt) {
        idle += dt;
        if (idle > 0 && !Object.keys(ptrs).length) {
          sph.th += dir * dt * 0.05;
          if (sph.th > AZ_MAX - 0.12) dir = -1; else if (sph.th < AZ_MIN + 0.12) dir = 1;
        }
        apply();
      };
    }

    /* --- クリック（報告書・社員） --- */
    var ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
    var picks = [stackHit]; if (shiba) picks.push(shiba.group);
    function pickAt(cx, cy) {
      mouse.set(cx / window.innerWidth * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
      ray.setFromCamera(mouse, camera);
      var hit = ray.intersectObjects(picks, true)[0];
      return hit ? hit.object.userData.action : null;
    }
    var downAt = null;
    renderer.domElement.addEventListener("pointerdown", function (e) { downAt = { x: e.clientX, y: e.clientY }; });
    renderer.domElement.addEventListener("pointerup", function (e) {
      if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) return;
      var act = pickAt(e.clientX, e.clientY); if (act) openModal(act);
    });
    renderer.domElement.addEventListener("pointermove", function (e) {
      if (e.buttons) return;
      renderer.domElement.style.cursor = pickAt(e.clientX, e.clientY) ? "pointer" : "grab";
    });

    window.addEventListener("resize", function () {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* --- 動き --- */
    var clockT = new THREE.Clock(), nextBlink = 1.5, blinkEnd = 0, lastSky = 0, tmpT = new THREE.Vector3();
    function loop() {
      requestAnimationFrame(loop);
      var dt = Math.min(clockT.getDelta(), 0.1), t = clockT.elapsedTime;

      var j = jst(), sec = j.s + j.ms / 1000;
      sHand.rotation.z = -sec / 60 * Math.PI * 2;
      mHand.rotation.z = -(j.mi + sec / 60) / 60 * Math.PI * 2;
      hHand.rotation.z = -((j.h % 12) + j.mi / 60) / 12 * Math.PI * 2;
      if (t - lastSky > 30) { lastSky = t; drawSky(); }

      plants.forEach(function (p, i) { p.rotation.z = Math.sin(t * 0.8 + i) * 0.015; });

      if (shiba) {
        var troubled = STATE === "search_failed";
        // まばたき
        if (t > nextBlink) { blinkEnd = t + 0.13; nextBlink = t + 2.2 + Math.random() * 3; }
        var ey = t < blinkEnd ? 0.006 : 0.045;
        shiba.eyes.forEach(function (e) { e.scale.y = ey; });
        // キーボードを打つ
        shiba.group.updateMatrixWorld();
        shiba.arms.forEach(function (a, i) {
          var bob = troubled ? Math.sin(t * 2 + i) * 0.004 : Math.max(0, Math.sin(t * 15 + i * 2.1)) * 0.035;
          tmpT.set(a.s * 0.16, 0.79 + bob, 0.43); shiba.group.localToWorld(tmpT); a.g.lookAt(tmpT);
        });
        shiba.head.rotation.x = troubled ? 0.12 : Math.sin(t * 7.5) * 0.025;
        shiba.head.rotation.z = troubled ? 0.14 + Math.sin(t * 1.2) * 0.03 : Math.sin(t * 0.9) * 0.05;
        shiba.tail.rotation.z = Math.sin(t * (troubled ? 2 : 11)) * (troubled ? 0.1 : 0.35);
        if (troubled) shiba.sweat.position.y = 0.1 - ((t * 0.25) % 0.08);
      }

      ctrlUpdate(dt);
      renderer.render(scene, camera);
      placeLabels();
    }
    loop();
  }
})();
</script>
